[project]
name = "pixelengine-backend"
version = "0.1.0"
description = "PixelEngine FastAPI backend"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.18.5,<2",
  "email-validator>=2.3,<3",
  "fastapi>=0.139,<0.140",
  "psycopg[binary]>=3.3.4,<4",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.11,<3",
  "pyjwt>=2.10,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn[standard]>=0.51,<0.52",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
